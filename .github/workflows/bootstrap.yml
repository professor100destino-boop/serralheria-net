name: Preparar Serralheria Net

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preparar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6

      - name: Reconstruir pacote
        shell: bash
        run: |
          cat bootstrap/package.b64.part1 bootstrap/package.b64.part2 bootstrap/package.b64.part3 > /tmp/package.b64
          xxd -r -p bootstrap/package.part4.hex >> /tmp/package.b64
          base64 -d /tmp/package.b64 > /tmp/serralheria-net.zip
          mkdir -p /tmp/serralheria-net
          unzip -q /tmp/serralheria-net.zip -d /tmp/serralheria-net
          cp -R /tmp/serralheria-net/public/. .
          cp /tmp/serralheria-net/wrangler.jsonc ./wrangler.jsonc
          touch .nojekyll

      - name: Publicar arquivos no repositório
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html manifest.webmanifest sw.js icon-192.png icon-512.png icon-maskable-512.png wrangler.jsonc .nojekyll
          git commit -m 'Publicar Serralheria Net' || exit 0
          git push

# publicação inicial
