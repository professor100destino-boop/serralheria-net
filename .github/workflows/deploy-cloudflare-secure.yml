name: Publicar Serralheria Net Seguro

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Baixar código
        uses: actions/checkout@v6

      - name: Validar credenciais
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'Falta CLOUDFLARE_API_TOKEN' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'Falta CLOUDFLARE_ACCOUNT_ID' && exit 1)

      - name: Localizar ou criar banco D1
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          LIST=$(curl -fsS "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database?per_page=100" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          DB_ID=$(echo "$LIST" | jq -r '.result[] | select(.name=="serralheria-net-db") | .uuid' | head -n1)
          if [ -z "$DB_ID" ] || [ "$DB_ID" = "null" ]; then
            CREATED=$(curl -fsS "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"name":"serralheria-net-db","primary_location_hint":"enam"}')
            DB_ID=$(echo "$CREATED" | jq -r '.result.uuid')
          fi
          test -n "$DB_ID" && test "$DB_ID" != "null"
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"
          echo "Banco D1 pronto: $DB_ID"

      - name: Gerar configuração de produção
        shell: bash
        env:
          DB_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          cat > wrangler.jsonc <<EOF
          {
            "$schema": "./node_modules/wrangler/config-schema.json",
            "name": "serralheria-net",
            "main": "src/worker.js",
            "compatibility_date": "2026-08-14",
            "assets": {
              "directory": ".",
              "binding": "ASSETS",
              "run_worker_first": true
            },
            "d1_databases": [
              {
                "binding": "DB",
                "database_name": "serralheria-net-db",
                "database_id": "$DB_ID"
              }
            ]
          }
          EOF

      - name: Aplicar estrutura do banco
        run: npx --yes wrangler@latest d1 execute serralheria-net-db --remote --file=./schema.sql

      - name: Publicar Worker
        run: npx --yes wrangler@latest deploy
